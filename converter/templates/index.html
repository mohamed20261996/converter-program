<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول الملفات الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 border border-slate-700">
        <h1 class="text-2xl sm:text-3xl font-bold text-center mb-2 text-indigo-400">✨ محول الملفات الشامل</h1>
        <p class="text-center text-slate-400 text-sm mb-6">تحويل سريع مع الحفاظ على التنسيق والبيانات</p>

        <form action="/convert" method="POST" enctype="multipart/form-data" class="space-y-6">
            
            <div class="border-2 border-dashed border-indigo-500/50 hover:border-indigo-400 rounded-xl p-6 text-center cursor-pointer bg-slate-800/50">
                <input type="file" name="file" id="fileInput" class="hidden" required onchange="updateFileName()">
                <label for="fileInput" class="cursor-pointer flex flex-col items-center">
                    <svg class="w-12 h-12 text-indigo-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 0115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <span id="fileName" class="text-sm text-slate-300 font-medium">اضغط هنا لاختيار الملف</span>
                </label>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-slate-300">اختر الصيغة المستهدفة:</label>
                <select name="format" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="docx">Word (DOCX)</option>
                    <option value="xlsx">Excel (XLSX)</option>
                    <option value="csv">CSV</option>
                    <option value="json">JSON</option>
                    <option value="png">PNG (صورة)</option>
                    <option value="jpg">JPG (صورة)</option>
                    <option value="pdf">PDF</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                ⚡ بدء التحويل وتنزيل الملف
            </button>
        </form>
    </div>

    <script>
        function updateFileName() {
            const input = document.getElementById('fileInput');
            const nameDisplay = document.getElementById('fileName');
            if (input.files.length > 0) {
                nameDisplay.textContent = "تم اختيار: " + input.files[0].name;
                nameDisplay.classList.add("text-emerald-400");
            }
        }
    </script>
</body>
</html>
